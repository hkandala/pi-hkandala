id = "pi-hkandala"
name = "pi-hkandala"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "A popup that runs a command given by the caller, for pi-hkandala extensions"
platforms = ["linux", "macos"]

# A program can open a herdr popup only from a plugin pane. A pane's command is fixed here, so
# each pane runs whatever the caller passes (--env POPUP_COMMAND='<shell command>'). herdr requires
# a non-blank title. The caller shows how to close the popup (the agent pi-herd attaches to shows
# "ctrl+b q or /detach to close" at its prompt), so the title only names what it shows.
[[panes]]
id = "attach"
title = "pi agent"
placement = "popup"
width = "85%"
height = "85%"
command = ["sh", "-c", "eval \"$POPUP_COMMAND\""]
