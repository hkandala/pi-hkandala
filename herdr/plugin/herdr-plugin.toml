id = "pi-hkandala"
name = "pi-hkandala"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "A popup that runs a command given by the caller, for pi-hkandala extensions"
platforms = ["linux", "macos"]

# herdr opens popups only from plugin panes. A pane's command and border title are fixed here, so
# each pane runs whatever the caller passes (--env POPUP_COMMAND='<shell command>') and its title
# says how to close it. Add a pane only for a new way of closing.
[[panes]]
id = "attach"
title = " ctrl+b q to close "
placement = "popup"
width = "85%"
height = "85%"
command = ["sh", "-c", "eval \"$POPUP_COMMAND\""]
