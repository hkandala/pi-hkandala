id = "pi-hkandala"
name = "pi-hkandala"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "A popup that runs a command given by the caller, for pi-hkandala extensions"
platforms = ["linux", "macos"]

# herdr opens popups only from plugin panes, and a pane's command is fixed here, so this one pane
# runs whatever the caller passes: herdr plugin pane open ... --env POPUP_COMMAND='<shell command>'
[[panes]]
id = "popup"
title = "popup"
placement = "popup"
width = "85%"
height = "85%"
command = ["sh", "-c", "eval \"$POPUP_COMMAND\""]
